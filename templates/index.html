<!DOCTYPE html>
<html>
<head>
    <title>Weather</title>
    <style>
        .layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        /* lewa kolumna */
        .left {
            width: 600px;
        }

        /* prawa kolumna */
        .right {
            width: 600px;
        }
        canvas {
            width: 600px !important;
            height: 300px !important;
            border: 1px solid black;
        }
        #map {
            height: 300px;
            width: 600px;
            border: 1px solid black;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        function toggleButton() {
            const cityName = document.getElementById("cityInput");
            console.log(cityName);
            const countryID = document.getElementById("countryCode");
            const submitButton = document.getElementById("submitButton");
            submitButton.disabled = cityName.value.trim() === "" || countryID.value.trim() === "";
        }
    </script>
</head>
<body style="background-color:rgba(0, 0, 255, 0.2);">
<p>Input the city name and ISO two-letter country code.</p>
<form method="post">
    <input id="cityInput" name="city" onkeyup= "toggleButton()" placeholder="City">
    <input id="countryCode" name="country" onkeyup= "toggleButton()" minlength="2" maxlength="2" placeholder="US">
    <button id="submitButton" disabled type="submit">Download weather</button>
</form>
<hr>

{% if weather %}
<h2>Weather for {{ city_name.title() }}, {{ country_code }}</h2>
<p>State: {{ state }}</p>

<div class="layout">
    <div class="left">
        <canvas id="chart_temperature" style="border:1px solid"></canvas>
        <hr>
        <canvas id="chart_wind"></canvas>
        <hr>
        <canvas id="chart_humidity"></canvas>
    </div>

    <div class="right">
        <div id="map"></div>
    </div>
</div>
<script>

const labels = {{ weather.time|tojson }};
const temps = {{ weather.temperature_2m|tojson }};
const wind = {{ weather.wind_speed_10m|tojson }};
const humidity = {{ weather.relative_humidity_2m|tojson }};
const lat = {{ lat }};
const lon = {{ lon }};

var map = L.map('map').setView([lat, lon], 8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

L.marker([lat, lon])
    .addTo(map)
    .bindPopup("{{ city_name }}")
    .openPopup();

new Chart(document.getElementById("chart_temperature"), {
    type: "bar",
    data: {
        labels: labels,
        datasets: [{
            label: "Temperature",
            data: temps
        }]
    },
     options: {
        backgroundColor:'rgba(255, 0, 0, 0.6)'
     }
});

new Chart(document.getElementById("chart_wind"), {
    type: "bar",
    data: {
        labels: labels,
        datasets: [{
            label: "Wind speed",
            data: wind
        }]
    },
     options: {
        backgroundColor:'rgba(54, 217, 0, 0.6)'
     }
});
new Chart(document.getElementById("chart_humidity"), {
    type: "bar",
    data: {
        labels: labels,
        datasets: [{
            label: "Humidity",
            data: humidity
        }]
    },
     options: {
        backgroundColor:'rgba(0, 94, 255, 0.6)'
     }
});

</script>
{% else %}
    No data.


{% endif %}

</body>
</html>
